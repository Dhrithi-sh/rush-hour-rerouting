name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest deps (Python 3.12)
            python: "3.12"
            pins: ""
          - name: minimum deps (Python 3.10)
            python: "3.10"
            # the lowest versions requirements.txt allows
            pins: "numpy==1.24.0 pandas==2.0.0 matplotlib==3.7.0 networkx==3.0 python-docx==1.1.0 pytest==7.4.0 hypothesis==6.80.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.pins }}" ]; then pip install ${{ matrix.pins }}; fi
          pip install -r requirements.txt ${{ matrix.pins }}
          pip install "ruff>=0.4"
      - name: Lint
        run: ruff check .
      - name: Tests (incl. hypothesis property tests)
        run: python -m pytest
      - name: Quick end-to-end pipeline
        run: python run_all.py --quick --out ci-results --report ci-results/report.docx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-results-${{ matrix.python }}
          path: ci-results/
